<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsApp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar / Lista de conversas -->
    <aside id="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <svg class="logo" viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          <span>WhatsApp</span>
        </div>
      </header>

      <div class="load-section">
        <button id="btnLoad" class="btn-primary" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
          Carregar conversas
        </button>
        <input type="file" id="zipInput" accept=".zip,application/zip" hidden />
      </div>

      <div id="chatList" class="chat-list">
        <div class="empty-state">
          <p>Nenhuma conversa carregada</p>
          <small>Clique em “Carregar conversas” e escolha o ZIP</small>
        </div>
      </div>
    </aside>

    <!-- Área da conversa -->
    <main id="main">
      <div id="welcome" class="welcome">
        <div class="welcome-content">
          <svg class="welcome-icon" viewBox="0 0 24 24" fill="currentColor" width="80" height="80">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          <h1>WhatsApp</h1>
          <p>Carregue o arquivo ZIP exportado para visualizar as mensagens.</p>
        </div>
      </div>

      <div id="chatView" class="chat-view hidden">
        <header class="chat-header">
          <button id="btnBack" class="btn-icon" type="button" aria-label="Voltar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <div class="chat-info" id="btnEditContact" title="Editar contato">
            <div class="avatar" id="chatAvatar">?</div>
            <div class="chat-text">
              <h2 id="chatTitle">Conversa</h2>
              <span id="chatMeta" class="chat-meta"></span>
            </div>
          </div>
        </header>
        <div id="messages" class="messages"></div>
      </div>
    </main>
  </div>

  <!-- Modal editar contato -->
  <div id="editModal" class="modal hidden">
    <div class="modal-box">
      <h3>Editar contato</h3>
      <div class="edit-avatar-wrap">
        <div class="edit-avatar" id="editAvatarPreview">?</div>
        <label class="btn-photo">
          Alterar foto
          <input type="file" id="editPhotoInput" accept="image/*" hidden />
        </label>
      </div>
      <label class="field">
        <span>Nome</span>
        <input type="text" id="editNameInput" placeholder="Nome do contato" maxlength="40" />
      </label>
      <div class="modal-actions">
        <button type="button" id="btnCancelEdit" class="btn-secondary">Cancelar</button>
        <button type="button" id="btnSaveEdit" class="btn-primary">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox-close" type="button">&times;</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
